<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirupati Temple Darshan Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

<div class="container">
  <div class="card shadow rounded p-4 mx-auto" style="max-width: 600px;">
    <div class="text-center mb-4">
      <img src="images/tirupati.png" alt="Tirupati Temple Logo" width="70">
      <h3 class="mt-2">Tirupati Temple Darshan Booking Form</h3>
    </div>
    
    <form id="darshanForm" novalidate>
      <!-- Full Name -->
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" required>
        <div class="invalid-feedback">Full name is required.</div>
      </div>

      <!-- Email Address -->
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" required>
        <div class="invalid-feedback">Valid email is required.</div>
      </div>

      <!-- Mobile Number with Country Code -->
      <div class="mb-3">
        <label class="form-label">Mobile Number</label>
        <div class="input-group">
          <select class="form-select" style="max-width: 80px;">
            <option selected>+91</option>
            <option>+1</option>
            <option>+44</option>
          </select>
          <input type="tel" class="form-control" pattern="[0-9]{10}" required>
        </div>
        <div class="invalid-feedback">Enter a valid 10-digit number.</div>
      </div>

      <!-- Gender -->
      <div class="mb-3">
        <label class="form-label">Gender</label><br>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" required>
          <label class="form-check-label">Male</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender">
          <label class="form-check-label">Female</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender">
          <label class="form-check-label">Other</label>
        </div>
      </div>

      <!-- Darshan Date & Time Slot -->
      <div class="row mb-3">
        <div class="col">
          <label class="form-label">Darshan Date</label>
          <input type="date" class="form-control" required>
        </div>
        <div class="col">
          <label class="form-label">Darshan Time Slot</label>
          <select class="form-select" required>
            <option value="">Select</option>
            <option>Morning</option>
            <option>Afternoon</option>
            <option>Evening</option>
          </select>
        </div>
      </div>

      <!-- Number of Tickets -->
      <div class="mb-3">
        <label class="form-label">Number of Tickets</label>
        <input type="number" class="form-control" min="1" max="10" required>
      </div>

      <!-- Seva Type -->
      <div class="mb-3">
        <label class="form-label">Seva Type</label><br>
        <div class="form-check form-check-inline">
          <input type="checkbox" class="form-check-input">
          <label class="form-check-label">Archana</label>
        </div>
        <div class="form-check form-check-inline">
          <input type="checkbox" class="form-check-input">
          <label class="form-check-label">Abhishekam</label>
        </div>
        <div class="form-check form-check-inline">
          <input type="checkbox" class="form-check-input">
          <label class="form-check-label">Special Entry Darshan</label>
        </div>
        <div class="form-check form-check-inline">
          <input type="checkbox" class="form-check-input">
          <label class="form-check-label">Suprabhata Seva</label>
        </div>
      </div>

      <!-- ID Proof Upload -->
      <div class="mb-3">
        <label class="form-label">
          ID Proof Upload 
          <img src="images/info.png" alt="Info" width="16" data-bs-toggle="tooltip" title="Upload JPG, PNG, or PDF.">
        </label>
        <input type="file" class="form-control" accept=".jpg,.png,.pdf" required>
      </div>

      <!-- Address -->
      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" rows="2" required></textarea>
      </div>

      <!-- Buttons -->
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4">
      <img src="images/success.png" alt="Success" width="80" class="mb-3">
      <h5>Your Tirupati Darshan Booking is Confirmed!</h5>
      <button type="button" class="btn btn-success mt-3" data-bs-dismiss="modal">OK</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Enable tooltip
  var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
  tooltipTriggerList.map(function (tooltipTriggerEl) {
    return new bootstrap.Tooltip(tooltipTriggerEl)
  });

  // Form validation + modal trigger
  (function () {
    'use strict'
    var form = document.getElementById('darshanForm')
    form.addEventListener('submit', function (event) {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      } else {
        event.preventDefault(); // Prevent actual submission
        var successModal = new bootstrap.Modal(document.getElementById('successModal'))
        successModal.show();
        form.reset();
        form.classList.remove('was-validated');
      }
      form.classList.add('was-validated')
    }, false)
  })()
</script>
</body>
</html>
