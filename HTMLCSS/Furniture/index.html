<!DOCTYPE html>
<html>
<head>
    <title>Furniture Store Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Furniture Store Catalog</h1>
        <p>Find the best furniture for your home</p>
    </header>

    <section class="products">
        
        <div class="product" style="background-color: #f0f8ff;">
            <img src="sofa.jpg" alt="Sofa">
            <h3 style="color: #007bff;">Sofa</h3>
            <p>Comfortable and stylish sofa</p>
            <p class="price">$499</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        
        <div class="product">
            <img src="dining-table.jpg" alt="Dining Table">
            <h3>Dining Table</h3>
            <p>Wooden dining table</p>
            <p class="price" style="color: green;">$299</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        
        <div class="product">
            <img src="chair.jpg" alt="Chair">
            <h3>Chair</h3>
            <p>Modern chair for any room</p>
            <p class="price">$149</p>
            <button class="buy-btn" style="background-color: black;">Buy Now</button>
        </div>
    </section>
</body>
</html>
