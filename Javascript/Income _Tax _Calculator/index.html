<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income Tax Calculator</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 20px;
    }
    h2 {
        text-align: center;
    }
    .container {
        background: white;
        padding: 20px;
        max-width: 400px;
        margin: auto;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 4px;
        border: 1px solid #ccc;
    }
    button {
        background: #007BFF;
        color: white;
        border: none;
        cursor: pointer;
    }
    button:hover {
        background: #0056b3;
    }
    pre {
        background: #eee;
        padding: 10px;
        border-radius: 4px;
    }
</style>
</head>
<body>

<h2>Income Tax Calculator</h2>
<div class="container">
    <label>Full Name:</label>
    <input type="text" id="name" placeholder="Enter full name">

    <label>PAN Number:</label>
    <input type="text" id="pan" placeholder="Enter PAN number (ABCDE1234F)" maxlength="10">

    <label>Date of Birth:</label>
    <input type="date" id="dob">

    <label>Annual Income (₹):</label>
    <input type="number" id="income" placeholder="Enter annual income">

    <button onclick="calculate()">Calculate Tax</button>

    <h3>Result:</h3>
    <pre id="result"></pre>
</div>

<script>
function validatePAN(pan) {
    return /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(pan);
}

function calculateAge(dob) {
    let birthDate = new Date(dob);
    let today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    let monthDiff = today.getMonth() - birthDate.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
        age--;
    }
    return age;
}

function calculateTax(income) {
    let tax = 0;
    if (income <= 250000) {
        tax = 0;
    } else if (income <= 500000) {
        tax = (income - 250000) * 0.05;
    } else if (income <= 1000000) {
        tax = (250000 * 0.05) + ((income - 500000) * 0.20);
    } else {
        tax = (250000 * 0.05) + (500000 * 0.20) + ((income - 1000000) * 0.30);
    }
    return Math.round(tax);
}

function calculate() {
    let name = document.getElementById("name").value.trim();
    let pan = document.getElementById("pan").value.trim();
    let dob = document.getElementById("dob").value;
    let income = parseFloat(document.getElementById("income").value);

    if (!name || !pan || !dob || isNaN(income)) {
        alert("Please fill all fields correctly.");
        return;
    }

    if (!validatePAN(pan)) {
        alert("Invalid PAN number! Must be uppercase, length 10, and in format ABCDE1234F.");
        return;
    }

    let age = calculateAge(dob);
    let tax = calculateTax(income);

    document.getElementById("result").textContent =
        `Name: ${name}\n` +
        `PAN: ${pan}\n` +
        `Age: ${age} years\n` +
        `Annual Income: ₹${income}\n` +
        `Calculated Tax: ₹${tax}`;
}
</script>

</body>
</html>
