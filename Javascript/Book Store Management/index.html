<!DOCTYPE html>
<html>
<head>
    <title>Book Store Management</title>
</head>
<body>
    <h2>JSON – Book Store Management</h2>
    <pre id="output"></pre>

    <script>
        
        function log(text) {
            document.getElementById("output").innerHTML += text + "\n";
        }

        
        let books = [
            { title: "JavaScript Basics", author: "Anu", price: 450, available: true },
            { title: "HTML & CSS", author: "Devi", price: 350, available: false }
        ];

    
        log("All Books:");
        for (let book of books) {
            log(`Title: ${book.title}, Author: ${book.author}, Price: ₹${book.price}, Available: ${book.available}`);
        }

        
        log("\nAvailable Books:");
        for (let book of books) {
            if (book.available) {
                log(`Title: ${book.title}, Author: ${book.author}, Price: ₹${book.price}`);
            }
        }

        
        books.push({ title: "Node.js Guide", author: "Ravi", price: 500, available: true });
        log("\nAfter Adding:");
        books.forEach(book => log(book.title));

        
        for (let book of books) {
            if (book.title === "JavaScript Basics") {
                book.price = 500;
            }
        }
        log("\nAfter Price Update:");
        for (let book of books) {
            if (book.title === "JavaScript Basics") {
                log(`${book.title} - ₹${book.price}`);
            }
        }

        
        books = books.filter(book => book.title !== "JavaScript Basics");
        log("\nAfter Deletion:");
        books.forEach(book => log(book.title));
    </script>
</body>
</html>
