<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Team Player Details</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 20px;
    }
    h1 {
        text-align: center;
        color: #2c3e50;
    }
    table {
        width: 80%;
        margin: auto;
        border-collapse: collapse;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    th, td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: center;
    }
    th {
        background: #2c3e50;
        color: white;
    }
    tr:hover {
        background: #f1f1f1;
    }
</style>
</head>
<body>

<h1>🏆 Sports Team Player Details</h1>

<table id="playerTable">
    <thead>
        <tr>
            <th>Player Name</th>
            <th>Sport</th>
            <th>Matches</th>
            <th>Runs / Goals</th>
            <th>Batting Average / Assists</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
const players = [
    {
        name: "Virat Kohli",
        age: 36,
        sport: "Cricket",
        stats: {
            matches: 500,
            runs: 25000,
            average: 57.2
        }
    },
    {
        name: "Lionel Messi",
        age: 37,
        sport: "Football",
        stats: {
            matches: 800,
            goals: 720,
            assists: 300
        }
    }
];

function displayPlayers() {
    const tbody = document.querySelector("#playerTable tbody");
    tbody.innerHTML = "";

    for (const { name, sport, stats } of players) {
        let matches, scoreData, extraData;

        if (sport === "Cricket") {
            ({ matches, runs: scoreData, average: extraData } = stats);
        } else if (sport === "Football") {
            ({ matches, goals: scoreData, assists: extraData } = stats);
        }

        const row = `
            <tr>
                <td>${name}</td>
                <td>${sport}</td>
                <td>${matches}</td>
                <td>${scoreData}</td>
                <td>${extraData}</td>
            </tr>
        `;
        tbody.innerHTML += row;
    }
}

displayPlayers();
</script>

</body>
</html>
