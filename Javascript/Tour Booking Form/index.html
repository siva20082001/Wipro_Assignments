<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Booking Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    h2, h3 {
      text-align: center;
      color: #333;
    }
    label {
      font-weight: bold;
      display: block;
      margin: 10px 0 5px;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #218838;
    }
    #summary {
      background: #f1f1f1;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Tour Booking Form</h2>

    <form id="tourForm">
      <label>Full Name</label>
      <input type="text" id="fullName" value="Thananya" required>

      <label>Email</label>
      <input type="email" id="email" value="Thananya@gmail.com" required>

      <label>Destination</label>
      <select id="destination" required>
        <option value="Ooty">Ooty</option>
        <option value="Goa" selected>Goa</option>
        <option value="Manali">Manali</option>
      </select>

      <label>Number of Days</label>
      <input type="number" id="days" min="1" value="2" required>

      <label>Number of Travelers</label>
      <input type="number" id="travelers" min="1" value="3" required>

      <button type="button" onclick="bookNow()">Book Now</button>
    </form>

    <h3>Booking Summary</h3>
    <div id="summary"></div>
  </div>

  <script>
    function bookNow() {
      let name = document.getElementById("fullName").value;
      let email = document.getElementById("email").value;
      let destination = document.getElementById("destination").value;
      let days = parseInt(document.getElementById("days").value);
      let travelers = parseInt(document.getElementById("travelers").value);

      let prices = { "Ooty": 2000, "Goa": 3000, "Manali": 4000 };

      let totalPrice = prices[destination] * days * travelers;

      let summary = `
        <strong>Name:</strong> ${name}<br>
        <strong>Email:</strong> ${email}<br>
        <strong>Destination:</strong> ${destination}<br>
        <strong>Days:</strong> ${days}<br>
        <strong>Travelers:</strong> ${travelers}<br>
        <strong>Total Price:</strong> ₹${totalPrice}
      `;

      document.getElementById("summary").innerHTML = summary;
    }
  </script>
</body>
</html>
